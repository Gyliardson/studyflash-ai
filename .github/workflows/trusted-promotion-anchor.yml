name: Trusted Promotion Anchor

on:
  workflow_run:
    workflows:
      - CI
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: trusted-promotion-anchor-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish-trusted-promotion-policy:
    name: Publish trusted promotion policy
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate trusted metadata and publish status on tested SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BASE_REPO: ${{ github.event.workflow_run.pull_requests[0].base.repo.full_name }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          state=failure
          description="Trusted promotion policy rejected this pull request"
          context=""

          case "$BASE_REF" in
            main)
              context="Trusted promotion source policy (main)"
              ;;
            portfolio/revamp-2026)
              context="Trusted promotion source policy (portfolio/revamp-2026)"
              ;;
            *)
              echo "Unexpected or missing base ref: ${BASE_REF:-<empty>}" >&2
              ;;
          esac

          if [[ -z "$TARGET_SHA" || -z "$PR_NUMBER" || -z "$context" ]]; then
            echo "Missing trusted workflow_run pull-request metadata; refusing success." >&2
          elif [[ "$BASE_REPO" != "$REPOSITORY" ]]; then
            echo "Unexpected base repository: $BASE_REPO" >&2
          elif [[ "$HEAD_REPO" != "$REPOSITORY" ]]; then
            echo "Fork pull requests are not eligible for protected promotion." >&2
          elif [[ "$SOURCE_CONCLUSION" != "success" ]]; then
            echo "Source CI did not succeed: $SOURCE_CONCLUSION" >&2
          elif [[ "$BASE_REF" == "main" && "$HEAD_REF" != "portfolio/revamp-2026" ]]; then
            echo "Only portfolio/revamp-2026 may promote into main." >&2
          elif [[ "$BASE_REF" == "portfolio/revamp-2026" && "$HEAD_REF" != work/* ]]; then
            echo "Only work/* branches may promote into portfolio/revamp-2026." >&2
          else
            state=success
            description="Trusted promotion topology accepted"
          fi

          if [[ -z "$context" || -z "$TARGET_SHA" ]]; then
            echo "Cannot publish a meaningful status without context and target SHA." >&2
            exit 1
          fi

          payload=$(jq -cn \
            --arg state "$state" \
            --arg context "$context" \
            --arg description "$description" \
            --arg target_url "$SOURCE_URL" \
            '{state:$state, context:$context, description:$description, target_url:$target_url}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$API_URL/repos/$REPOSITORY/statuses/$TARGET_SHA" \
            --data "$payload"

          echo
          echo "Published '$context'=$state on tested SHA $TARGET_SHA."

          test "$state" = success
