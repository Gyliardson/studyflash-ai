name: Dependency lock refresh

on:
  push:
    branches:
      - work/10-dependency-security

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve patched dependency graph without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Capture candidate audits
        shell: bash
        run: |
          npm audit --json > npm-audit-candidate-all.json || true
          npm audit --omit=dev --json > npm-audit-candidate-production.json || true

      - name: Upload candidate lockfile and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-candidate-${{ github.sha }}
          path: |
            frontend/package-lock.json
            frontend/npm-audit-candidate-all.json
            frontend/npm-audit-candidate-production.json
          if-no-files-found: error
          retention-days: 3
