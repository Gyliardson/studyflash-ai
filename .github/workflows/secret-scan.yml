name: Secret Scan

on:
  push:
    branches:
      - portfolio/revamp-2026
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-history:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Assert checkout contains candidate history
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "Secret Scan requires a non-shallow checkout." >&2
            exit 1
          fi

          commit_count="$(git rev-list --count HEAD)"
          if (( commit_count < 2 )); then
            echo "Secret Scan expected full reachable history, found only ${commit_count} commit(s)." >&2
            exit 1
          fi
          echo "Reachable candidate history: ${commit_count} commits"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail --silent --show-error --location "$download_url" --output "$archive_path"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive_path}" | sha256sum --check --strict -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          echo "GITLEAKS_BIN=${RUNNER_TEMP}/gitleaks" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Prove shared scanner detects merge-resolution-only deleted secret
        shell: bash
        run: |
          set -euo pipefail
          canary_repo="${RUNNER_TEMP}/gitleaks-history-canary"
          mkdir -p "$canary_repo"
          cd "$canary_repo"

          git init --quiet
          git config user.name "StudyFlash CI"
          git config user.email "studyflash-ci@example.invalid"

          cat > canary.toml <<'EOF'
          title = "StudyFlash merge-resolution history-scope canary"

          [[rules]]
          id = "merge-resolution-history-canary"
          description = "Synthetic secret introduced only by a merge resolution and removed afterwards"
          regex = '''STUDYFLASH_MERGE_CANARY_[A-Z0-9]{32}'''
          EOF

          printf '%s\n' 'base' > base.txt
          git add base.txt
          git commit --quiet -m "canary: base"

          git checkout --quiet -b side
          printf '%s\n' 'side parent content' > side.txt
          git add side.txt
          git commit --quiet -m "canary: side parent"
          side_parent="$(git rev-parse HEAD)"

          git checkout --quiet master
          printf '%s\n' 'main parent content' > main.txt
          git add main.txt
          git commit --quiet -m "canary: main parent"
          main_parent="$(git rev-parse HEAD)"

          git merge --quiet --no-commit side
          printf '%s\n' 'token = STUDYFLASH_MERGE_CANARY_0123456789ABCDEF0123456789ABCDEF' > merge-resolution-secret.txt
          git add merge-resolution-secret.txt
          git commit --quiet -m "canary: merge with resolution-only synthetic secret"
          merge_commit="$(git rev-parse HEAD)"

          if git grep -q 'STUDYFLASH_MERGE_CANARY_' "$main_parent" -- 2>/dev/null; then
            echo "Canary setup failed: secret exists in first parent." >&2
            exit 1
          fi
          if git grep -q 'STUDYFLASH_MERGE_CANARY_' "$side_parent" -- 2>/dev/null; then
            echo "Canary setup failed: secret exists in second parent." >&2
            exit 1
          fi
          git show "${merge_commit}:merge-resolution-secret.txt" | grep -q 'STUDYFLASH_MERGE_CANARY_' || {
            echo "Canary setup failed: merge commit does not contain synthetic secret." >&2
            exit 1
          }

          git rm --quiet merge-resolution-secret.txt
          git commit --quiet -m "canary: remove merge-resolution synthetic secret"

          if [[ -e merge-resolution-secret.txt ]]; then
            echo "Canary setup failed: synthetic secret still exists in the working tree." >&2
            exit 1
          fi

          set +e
          bash "$GITHUB_WORKSPACE/.github/scripts/scan-git-history.sh" \
            --repo "$canary_repo" \
            --config "$canary_repo/canary.toml" \
            --report "$canary_repo/canary-report.json"
          canary_status=$?
          set -e

          if [[ "$canary_status" -ne 1 ]]; then
            echo "Merge-resolution canary expected shared scanner exit 1, got ${canary_status}." >&2
            exit 1
          fi

          CANARY_REPORT="$canary_repo/canary-report.json" MERGE_COMMIT="$merge_commit" python - <<'PY'
          import json
          import os
          from pathlib import Path

          findings = json.loads(Path(os.environ["CANARY_REPORT"]).read_text())
          matching = [f for f in findings if f.get("RuleID") == "merge-resolution-history-canary"]
          if not matching:
              raise SystemExit("Shared production scanner did not detect the merge-resolution-only secret")
          if not any(f.get("Commit") == os.environ["MERGE_COMMIT"] for f in matching):
              raise SystemExit("Canary finding was not attributed to the merge commit")
          print("Shared scanner canary passed: merge-resolution-only deleted secret was detected")
          PY

      - name: Prove plain git-log mutation is rejected by merge-resolution canary
        shell: bash
        run: |
          set -euo pipefail
          canary_repo="${RUNNER_TEMP}/gitleaks-history-canary"
          mutant="${RUNNER_TEMP}/scan-git-history-plain-log-mutant.sh"

          cp "$GITHUB_WORKSPACE/.github/scripts/scan-git-history.sh" "$mutant"
          sed -i 's/log_opts="--full-history -m HEAD"/log_opts="HEAD"/' "$mutant"
          grep -Fx 'log_opts="HEAD"' "$mutant" >/dev/null || {
            echo "Mutation proof could not downgrade the shared scanner to plain git log." >&2
            exit 1
          }
          if grep -F -- '--full-history -m HEAD' "$mutant" >/dev/null; then
            echo "Mutation proof unexpectedly retained merge-expansion options." >&2
            exit 1
          fi

          rm -f "$canary_repo/mutant-report.json"
          set +e
          bash "$mutant" \
            --repo "$canary_repo" \
            --config "$canary_repo/canary.toml" \
            --report "$canary_repo/mutant-report.json"
          mutant_status=$?
          set -e

          if [[ "$mutant_status" -ne 0 ]]; then
            echo "Plain git-log mutant unexpectedly detected merge-resolution-only history or failed for another reason (status ${mutant_status})." >&2
            exit 1
          fi

          echo "Mutation proof passed: plain git log misses the merge-resolution-only secret, while production -m history scanning detects it."

      - name: Scan complete reachable repository history through shared production path
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.github/scripts/scan-git-history.sh" \
            --repo "$GITHUB_WORKSPACE" \
            --report "${RUNNER_TEMP}/gitleaks-report.json"

      - name: Summarize redacted findings
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          [[ -s "$report" ]] || exit 0
          REPORT_PATH="$report" python - <<'PY'
          import json
          import os
          from pathlib import Path

          findings = json.loads(Path(os.environ["REPORT_PATH"]).read_text())
          print(f"Full-history Gitleaks findings: {len(findings)}")
          for finding in findings:
              print(
                  "rule={rule} file={file} line={line} commit={commit} date={date}".format(
                      rule=finding.get("RuleID", "unknown"),
                      file=finding.get("File", "unknown"),
                      line=finding.get("StartLine", "unknown"),
                      commit=finding.get("Commit", "unknown"),
                      date=finding.get("Date", "unknown"),
                  )
              )
          PY

      - name: Upload redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gitleaks-report.json
            ${{ runner.temp }}/gitleaks-history-canary/canary-report.json
            ${{ runner.temp }}/gitleaks-history-canary/mutant-report.json
          if-no-files-found: ignore
          retention-days: 14
