name: Secret Scan

on:
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-history:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Assert checkout contains candidate history
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "Secret Scan requires a non-shallow checkout." >&2
            exit 1
          fi

          commit_count="$(git rev-list --count HEAD)"
          if (( commit_count < 2 )); then
            echo "Secret Scan expected full reachable history, found only ${commit_count} commit(s)." >&2
            exit 1
          fi
          echo "Reachable candidate history: ${commit_count} commits"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail --silent --show-error --location "$download_url" --output "$archive_path"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive_path}" | sha256sum --check --strict -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          echo "GITLEAKS_BIN=${RUNNER_TEMP}/gitleaks" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/gitleaks" version

      - name: Prove deleted-secret history is scanned
        shell: bash
        run: |
          set -euo pipefail
          canary_repo="${RUNNER_TEMP}/gitleaks-history-canary"
          mkdir -p "$canary_repo"
          cd "$canary_repo"

          git init --quiet
          git config user.name "StudyFlash CI"
          git config user.email "studyflash-ci@example.invalid"

          cat > canary.toml <<'EOF'
          title = "StudyFlash history-scope canary"

          [[rules]]
          id = "history-scope-canary"
          description = "Synthetic CI canary that must only be recoverable from git history"
          regex = '''STUDYFLASH_HISTORY_CANARY_[A-Z0-9]{32}'''
          EOF

          printf '%s\n' 'token = STUDYFLASH_HISTORY_CANARY_0123456789ABCDEF0123456789ABCDEF' > deleted-secret.txt
          git add deleted-secret.txt
          git commit --quiet -m "canary: add synthetic secret"
          rm deleted-secret.txt
          git add -u
          git commit --quiet -m "canary: remove synthetic secret"

          if [[ -e deleted-secret.txt ]]; then
            echo "Canary setup failed: synthetic secret still exists in the working tree." >&2
            exit 1
          fi

          set +e
          "$GITLEAKS_BIN" git \
            --config canary.toml \
            --log-opts="HEAD" \
            --report-format json \
            --report-path canary-report.json \
            --redact \
            .
          canary_status=$?
          set -e

          if [[ "$canary_status" -ne 1 ]]; then
            echo "History-scope canary expected Gitleaks exit 1, got ${canary_status}." >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path("canary-report.json").read_text())
          if not any(finding.get("RuleID") == "history-scope-canary" for finding in findings):
              raise SystemExit("History-scope canary did not detect the deleted synthetic secret")
          print("History-scope canary passed: deleted secret was detected from git history")
          PY

      - name: Scan complete reachable repository history
        shell: bash
        run: |
          set -euo pipefail
          commit_count="$(git rev-list --count HEAD)"
          echo "Scanning all ${commit_count} commits reachable from candidate HEAD"
          "$GITLEAKS_BIN" git \
            --log-opts="HEAD" \
            --redact \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json" \
            .

      - name: Summarize redacted findings
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks-report.json"
          [[ -s "$report" ]] || exit 0
          REPORT_PATH="$report" python - <<'PY'
          import json
          import os
          from pathlib import Path

          findings = json.loads(Path(os.environ["REPORT_PATH"]).read_text())
          print(f"Full-history Gitleaks findings: {len(findings)}")
          for finding in findings:
              print(
                  "rule={rule} file={file} line={line} commit={commit} date={date}".format(
                      rule=finding.get("RuleID", "unknown"),
                      file=finding.get("File", "unknown"),
                      line=finding.get("StartLine", "unknown"),
                      commit=finding.get("Commit", "unknown"),
                      date=finding.get("Date", "unknown"),
                  )
              )
          PY

      - name: Upload redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14
