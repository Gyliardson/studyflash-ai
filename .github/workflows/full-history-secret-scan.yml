name: Full History Secret Scan

on:
  push:
    branches:
      - security/full-history-secret-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every repository branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Install pinned Gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable Git history without publishing secret values
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all' \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format=json \
            --report-path="$report"
          scanner_status=$?
          set -e

          if [[ "$scanner_status" -ne 0 && "$scanner_status" -ne 1 ]]; then
            echo "Gitleaks scanner failed operationally with status ${scanner_status}." >&2
            exit "$scanner_status"
          fi

          python - "$report" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          findings = json.loads(report.read_text(encoding="utf-8")) if report.exists() and report.stat().st_size else []

          # These exact historical coordinates were manually inspected after the first
          # redacted full-history run. Each is the same public/synthetic Clerk
          # publishable-key example used for static build/browser smoke validation.
          # No secret value is stored in this exception list.
          accepted_synthetic = {
              ("generic-api-key", ".github/workflows/ci.yml", "42eba4c4ea78c27a43c9e6f6dbac3ee4a494dc99", 29),
              ("generic-api-key", ".github/workflows/ci.yml", "68f65663939e78878ffc1ffcd04a5d01b91d8e87", 29),
              ("generic-api-key", ".github/workflows/e2e.yml", "68def5acf3a876b0a63fa51c15ba0db3053d3349", 27),
          }

          unexpected = []
          accepted = []
          for item in findings:
              coordinate = (
                  item.get("RuleID", "unknown"),
                  item.get("File", "unknown"),
                  item.get("Commit", "unknown"),
                  item.get("StartLine", -1),
              )
              if coordinate in accepted_synthetic:
                  accepted.append(coordinate)
              else:
                  unexpected.append(coordinate)

          print(f"Gitleaks raw findings: {len(findings)}")
          print(f"Accepted reviewed synthetic findings: {len(accepted)}")
          for rule, path, commit, line in accepted:
              print(f"- accepted synthetic: rule={rule} file={path} commit={commit} line={line}")

          if unexpected:
              print(f"Unexpected findings requiring security triage: {len(unexpected)}", file=sys.stderr)
              for rule, path, commit, line in unexpected:
                  print(f"- rule={rule} file={path} commit={commit} line={line}", file=sys.stderr)
              raise SystemExit(1)

          print("No unreviewed secret findings remain.")
          PY
