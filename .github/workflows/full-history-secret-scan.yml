name: Full History Secret Scan

on:
  push:
    branches:
      - security/full-history-secret-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch every repository branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Install pinned Gitleaks binary
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all reachable Git history without publishing secret values
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts='--all' \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format=json \
            --report-path="$report"
          status=$?
          set -e

          if [[ -s "$report" ]]; then
            python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              findings = json.load(handle)

          print(f"Gitleaks findings: {len(findings)}")
          for item in findings:
              print(
                  "- rule={rule} file={file} commit={commit} line={line}".format(
                      rule=item.get("RuleID", "unknown"),
                      file=item.get("File", "unknown"),
                      commit=item.get("Commit", "unknown"),
                      line=item.get("StartLine", "unknown"),
                  )
              )
          PY
          else
            echo 'Gitleaks findings: 0'
          fi

          exit "$status"
