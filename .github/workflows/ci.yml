name: CI

on:
  push:
    branches:
      - portfolio/revamp-2026
      - 'work/**'
  pull_request:
    branches:
      - portfolio/revamp-2026
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend targeted lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint security boundaries
        run: npx eslint lib/db.ts lib/ai-api.ts app/api/ai/gerar/route.ts app/actions.ts

      - name: Gate server-only AI boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "NEXT_PUBLIC_API_URL" app/actions.ts app/dashboard/page.tsx app/api/ai/gerar/route.ts lib/ai-api.ts; then
            echo "Public AI backend URL leaked into a protected caller" >&2
            exit 1
          fi
          grep -q 'getAiApiUrl()}/api/gerar-plano' app/actions.ts
          grep -q 'getAiApiUrl()}/api/gerar-cards-topico' app/actions.ts
          grep -q 'getAiApiUrl()}/api/gerar-prova' app/actions.ts
          test "$(grep -o 'getAiApiHeaders(' app/actions.ts | wc -l)" -ge 3
          grep -q 'fetch("/api/ai/gerar"' app/dashboard/page.tsx
          grep -q 'import "server-only"' lib/ai-api.ts
          grep -q 'STUDYFLASH_INTERNAL_API_KEY' lib/ai-api.ts
          grep -q 'X-StudyFlash-Internal-Key' lib/ai-api.ts

      - name: Typecheck
        run: npx tsc --noEmit

  ownership-integration:
    name: Cross-user ownership (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studyflash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studyflash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studyflash_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/studyflash_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create disposable schema
        run: npx prisma db push

      - name: Run ownership integration tests
        run: node --test --experimental-strip-types tests/ownership.test.mjs

  backend-quality:
    name: Backend syntax and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Run backend security tests
        run: python -m unittest -v tests.test_request_security
