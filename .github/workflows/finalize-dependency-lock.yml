name: Finalize dependency lock

on:
  push:
    branches:
      - work/10-dependency-security

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/10-dependency-security
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate using CI semantics
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit final lock and remove temporary helpers
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refresh-dependency-lock.yml .github/workflows/finalize-dependency-lock.yml
          git add frontend/package-lock.json
          git commit -m "fix: synchronize dependency lockfile and remove temporary helpers"
          git push origin HEAD:work/10-dependency-security
