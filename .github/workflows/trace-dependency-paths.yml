name: Trace dependency paths

on:
  push:
    branches:
      - work/10-dependency-security

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/10-dependency-security
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Trace residual production packages
        run: |
          npm ls fast-uri lodash --omit=dev --all || true
      - name: Remove diagnostic helper
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/trace-dependency-paths.yml
          git commit -m "chore: remove dependency path diagnostic"
          git push origin HEAD:work/10-dependency-security
