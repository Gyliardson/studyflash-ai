name: Refresh dependency lockfile

on:
  push:
    branches:
      - work/10-dependency-security

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/10-dependency-security
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package-lock using CI peer semantics
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean-install compatibility
        run: npm ci --ignore-scripts
      - name: Commit lockfile only when changed
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix(security): synchronize dependency lockfile"
          git push origin HEAD:work/10-dependency-security
