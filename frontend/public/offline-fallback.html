<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sem conexão | StudyFlash</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: Canvas; color: CanvasText; }
      main { width: min(100%, 36rem); text-align: center; }
      h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.1; }
      p { margin: 0 auto; max-width: 32rem; line-height: 1.6; color: GrayText; }
      strong { color: CanvasText; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p><strong>StudyFlash não mantém conteúdos da sua conta em cache offline.</strong> Reconecte-se para carregar seus decks, sessões e progresso com dados atualizados.</p>
    </main>
  </body>
</html>
